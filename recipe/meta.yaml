{% set name = "jwcrypto" %}
{% set version = "1.5.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c3d7114b6f6e65b52f6b7da817eb8cb8423e1da31e1ef13508447c81ecbdcc34

build:
  skip: True  # [py<38]
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python
    - pip
    - hatchling
  run:
    - python
    - cryptography >=39.0.0
    - typing_extensions >=4.5.0

test:
  imports:
    - jwcrypto
    - jwcrypto.jwa
    - jwcrypto.jwe
    - jwcrypto.jwk
    - jwcrypto.jws
    - jwcrypto.jwt
    - jwcrypto.tests
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://jwcrypto.readthedocs.io
  license: LGPL-3.0-only
  license_family: LGPL
  license_file: LICENSE
  summary: Implements JWK,JWS,JWE specifications using python-cryptography
  description: |
    An implementation of the JOSE Working Group documents: RFC 7515 - JSON Web
    Signature (JWS) RFC 7516 - JSON Web Encryption (JWE) RFC 7517 - JSON Web
    Key (JWK) RFC 7518 - JSON Web Algorithms (JWA) RFC 7519 - JSON Web Token
    (JWT) RFC 7520 - Examples of Protecting Content Using JSON Object Signing
    and Encryption (JOSE)
  doc_url: https://jwcrypto.readthedocs.io
  dev_url: https://github.com/latchset/jwcrypto

extra:
  recipe-maintainers:
    - aymondebroglie
    - scopatz
